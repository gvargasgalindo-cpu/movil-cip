services:
  - type: web
    name: crypto-signal-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SIGNAL_API_KEY
        sync: false
      - key: CRYPTOPANIC_API_KEY
        sync: false
      - key: DEFAULT_USDTMXN_RATE
        value: "20.15"
